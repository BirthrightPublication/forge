name: Native speech model acceptance

on:
  workflow_dispatch:
  push:
    branches: ['development/v0.8-speech-studio']
    paths:
      - .github/workflows/speech-acceptance.yml
      - tests/speech_network_probe.py
      - tests/tts_model_acceptance.py
      - tests/asr_model_acceptance.py

permissions:
  contents: read

jobs:
  publishers:
    name: Verify native Windows publisher access
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read immutable model metadata and publisher notices
        shell: pwsh
        run: |
          python tests/speech_network_probe.py --output "$env:RUNNER_TEMP/speech-publishers"
          if ($LASTEXITCODE -ne 0) { throw 'Model publisher access failed; inference and publication must remain blocked.' }
      - name: Preserve publisher access evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: speech-publishers-${{ github.run_id }}
          path: ${{ runner.temp }}/speech-publishers/
          if-no-files-found: error
          retention-days: 14

  asr:
    name: Real Windows CPU recognition (${{ matrix.model }})
    needs: [publishers, tts]
    if: always() && needs.publishers.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        model: [bark-3.0, bark-3.0-plus, bark-3.0-pro, bark-3.0-clean]
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: speech-kokoro-${{ github.run_id }}
          path: fixture
      - name: Install application and verified media-test prerequisites
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 -r requirements-core.txt
          if ($LASTEXITCODE -ne 0) { throw 'Application acceptance dependencies failed.' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Verified FFmpeg acceptance installation failed.' }
          }
          ffmpeg -version
          ffprobe -version
      - name: Transcribe actual synthetic speech and compare references
        shell: pwsh
        run: |
          $comparison = @('--skip-whisper')
          if ('${{ matrix.model }}' -eq 'bark-3.0-plus') { $comparison = @('--whisper-model','large-v3') }
          if ('${{ matrix.model }}' -eq 'bark-3.0-pro') { $comparison = @('--whisper-model','large-v3-turbo') }
          python tests/asr_model_acceptance.py --data "$env:RUNNER_TEMP/asr-models" --output "$env:RUNNER_TEMP/asr-evidence" --audio fixture/acceptance-reference.wav --reference fixture/acceptance-reference.txt --fixture-manifest fixture/acceptance-reference.json --allow-model-downloads --bark-model '${{ matrix.model }}' @comparison
          if ($LASTEXITCODE -ne 0) { throw 'Real recognition acceptance failed; publication remains blocked.' }
      - name: Preserve recognition acceptance receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: speech-${{ matrix.model }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/asr-evidence/ASR_MODEL_ACCEPTANCE.json
            ${{ runner.temp }}/asr-evidence/**/process.log
          if-no-files-found: warn
          retention-days: 14

  tts:
    name: Real Windows CPU synthesis (${{ matrix.engine }})
    needs: publishers
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        engine: [kokoro, ming]
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install application acceptance dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 -r requirements-core.txt
          if ($LASTEXITCODE -ne 0) { throw 'Application acceptance dependencies failed.' }
      - name: Install and exercise the actual isolated speech engine
        shell: pwsh
        run: |
          python tests/tts_model_acceptance.py --engine '${{ matrix.engine }}' --data "$env:RUNNER_TEMP/${{ matrix.engine }}-models" --output "$env:RUNNER_TEMP/${{ matrix.engine }}-evidence" --scope full --allow-model-downloads
          if ($LASTEXITCODE -ne 0) { throw 'Real speech installation or synthesis failed; publication remains blocked.' }
      - name: Preserve synthetic audio and acceptance receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: speech-${{ matrix.engine }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ matrix.engine }}-evidence/
          if-no-files-found: error
          retention-days: 14
