name: Development review

on:
  push:
    branches:
      - 'development/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: forge-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the development commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      branch: ${{ steps.source.outputs.branch }}
      sha: ${{ steps.source.outputs.sha }}
    env:
      TEST_OUTPUT: /tmp/forge-review-${{ github.run_id }}
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - id: source
        name: Validate the development branch identity
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          branch = os.environ['GITHUB_REF_NAME']
          sha = os.environ['GITHUB_SHA']
          if (not re.fullmatch(r'development/[A-Za-z0-9][A-Za-z0-9._/-]{0,150}', branch)
                  or os.environ['GITHUB_REF'] != 'refs/heads/' + branch
                  or not re.fullmatch(r'[a-f0-9]{40}', sha)):
              raise SystemExit('Review automation accepts only a development branch push with a valid commit identity.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'branch={branch}\nsha={sha}\n')
          Path(os.environ['TEST_OUTPUT']).mkdir(parents=True)
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; Node 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Node 24
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
            scripts/requirements-media-privacy.txt
      - name: Verify local media validation prerequisites
        timeout-minutes: 10
        run: |
          mkdir -p "$TEST_OUTPUT"
          media_log="$TEST_OUTPUT/media-prerequisites.txt"
          trap 'code=$?; tail -n 12 "$media_log" 2>/dev/null | while IFS= read -r line; do line="${line//%/%25}"; echo "::error title=Media prerequisite setup::$line"; done; exit "$code"' ERR
          if ! command -v ffmpeg || ! command -v ffprobe || [[ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]]; then
            if ! sudo timeout 120 apt-get install --no-install-recommends -y -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 ffmpeg fonts-dejavu-core 2>&1 | tee "$media_log"; then
              source_file="$RUNNER_TEMP/forge-review-ubuntu.sources"
              printf '%s\n' 'Types: deb' 'URIs: https://archive.ubuntu.com/ubuntu/' 'Suites: noble noble-updates noble-backports' 'Components: main restricted universe multiverse' 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' '' 'Types: deb' 'URIs: https://security.ubuntu.com/ubuntu/' 'Suites: noble-security' 'Components: main restricted universe multiverse' 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' > "$source_file"
              source_options=(-o "Dir::Etc::sourcelist=$source_file" -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true)
              sudo timeout 180 apt-get update "${source_options[@]}" -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 2>&1 | tee -a "$media_log"
              sudo timeout 180 apt-get install "${source_options[@]}" --no-install-recommends -y -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 ffmpeg fonts-dejavu-core 2>&1 | tee -a "$media_log"
            fi
          fi
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Install Python validation dependencies
        timeout-minutes: 8
        run: |
          mkdir -p "$TEST_OUTPUT"
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 --only-binary=:all: -r requirements-dev.txt | tee "$TEST_OUTPUT/dependency-install.txt"
          if [[ -f scripts/requirements-media-privacy.txt ]]; then
            python -m pip install --disable-pip-version-check --timeout 30 --retries 1 --only-binary=:all: -r scripts/requirements-media-privacy.txt | tee -a "$TEST_OUTPUT/dependency-install.txt"
          fi
          python -m pip check
          command -v ffmpeg
          command -v ffprobe
      - name: Run the complete Python suite
        run: python -m pytest -q --junitxml="$TEST_OUTPUT/PYTEST.xml" | tee "$TEST_OUTPUT/PYTHON_TEST_RESULTS.txt"
      - name: Install Chromium for interface acceptance
        if: (startsWith(github.ref_name, 'development/v0.7-') || startsWith(github.ref_name, 'development/v0.8-') || startsWith(github.ref_name, 'development/v0.9-'))
        run: python -m playwright install --with-deps chromium
      - name: Validate V0.7 interface and address controls
        if: (startsWith(github.ref_name, 'development/v0.7-') || startsWith(github.ref_name, 'development/v0.8-') || startsWith(github.ref_name, 'development/v0.9-'))
        run: |
          python tests/browser_v7_check.py --output "$TEST_OUTPUT/v07-browser"
          python tests/browser_generators_check.py --output "$TEST_OUTPUT/generator-browser"
          if [[ -f tests/browser_v8_check.py ]]; then python tests/browser_v8_check.py --output "$TEST_OUTPUT/v08-browser"; fi
          if [[ -f tests/browser_v9_check.py ]]; then python tests/browser_v9_check.py --output "$TEST_OUTPUT/v09-browser"; fi
      - name: Retain Python validation results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node 24
        with:
          name: review-validation-${{ github.run_id }}
          path: /tmp/forge-review-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14

  windows-candidate:
    name: Native maintenance and Windows installation acceptance
    if: startsWith(github.ref_name, 'development/v0.6-') || startsWith(github.ref_name, 'development/v0.7-') || startsWith(github.ref_name, 'development/v0.8-') || startsWith(github.ref_name, 'development/v0.9-')
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Preserve source bytes for manifest verification
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install acceptance dependencies
        run: |
          python -m pip install -r requirements-core.txt pytest==9.0.2 httpx==0.28.1 cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance dependency verification failed.' }
      - name: Run native process and shared update contracts
        run: |
          python -m pytest -q tests/test_v6_models.py tests/test_v6_integration.py tests/test_v6_maintenance.py tests/test_birthright_update_core.py tests/test_v7_studio.py tests/test_speech_documents.py tests/test_speech_engines_v8.py --junitxml="$env:RUNNER_TEMP/v06-native.xml"
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "$env:RUNNER_TEMP/v06-native.xml") {
              [xml]$report = Get-Content "$env:RUNNER_TEMP/v06-native.xml" -Raw
              foreach ($failure in $report.SelectNodes('//testcase[failure or error]')) {
                $details = if ($failure.failure) { $failure.failure.message } else { $failure.error.message }
                $message = ([string]$details).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Output "::error title=$($failure.name)::$message"
              }
            }
            throw 'Native contract tests failed.'
          }
      - name: Build and validate the candidate Windows package
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $buildOutput = & python scripts/package_windows_release.py build --source . --output "$env:RUNNER_TEMP/v06-package" --tag "v$version" 2>&1
          $buildCode = $LASTEXITCODE
          $buildOutput | Write-Output
          if ($buildCode -ne 0) {
            $message = (($buildOutput | Select-Object -Last 10) -join ' ').Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Candidate package verification::$message"
            throw 'Candidate packaging failed.'
          }
          $archive = Join-Path $env:RUNNER_TEMP "v06-package/FORGE-v$version-windows-x64.zip"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_release_acceptance.ps1 -Archive $archive -Checksum "$archive.sha256" -Output "$env:RUNNER_TEMP/v06-windows-acceptance" -PythonExecutable (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Unchanged updater acceptance failed.' }
      - name: Verify real V0.9 Windows downloads and interruption recovery
        if: startsWith(github.ref_name, 'development/v0.9-')
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 --only-binary=:all: -r requirements-downloads.txt
          if ($LASTEXITCODE -ne 0) { throw 'Required downloader installation failed.' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Required native media prerequisites failed.' }
          }
          python scripts/check_download_acceptance.py --require-windows --output "$env:RUNNER_TEMP/v09-download-acceptance"
          if ($LASTEXITCODE -ne 0) { throw 'Real native download acceptance failed; skipped media cases are not accepted.' }
      - name: Retain native acceptance results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-candidate-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v06-native.xml
            ${{ runner.temp }}/v06-package/
            ${{ runner.temp }}/v06-windows-acceptance/windows-acceptance.json
            ${{ runner.temp }}/v06-windows-acceptance/*/installed-app-smoke.json
            ${{ runner.temp }}/v09-download-acceptance/
          if-no-files-found: warn

  draft:
    name: Open a draft for human review
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      SOURCE_BRANCH: ${{ needs.validate.outputs.branch }}
      TESTED_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      # This job never checks out or executes application source. The default
      # repository token is used only for repository reads and draft creation.
      - name: Create a draft only if the tested branch has no existing PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          from urllib.parse import quote

          def redact(value):
              if isinstance(value, bytes):
                  value = value.decode('utf-8', errors='replace')
              for name in ('GH_TOKEN', 'GITHUB_TOKEN'):
                  token = os.environ.get(name)
                  if token:
                      value = value.replace(token, '[redacted]')
              return value

          def fail(operation, details):
              message = redact(operation + ': ' + redact(details))
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Draft PR automation failed::' + message, flush=True)
              raise SystemExit(1)

          def gh(operation, *arguments):
              try:
                  result = subprocess.run(['gh', *arguments], capture_output=True, timeout=90)
              except subprocess.TimeoutExpired as error:
                  fail(operation, 'GitHub CLI timed out after 90 seconds.\n' + redact(error.stderr or b''))
              except OSError as error:
                  fail(operation, str(error))
              if result.returncode:
                  # Preserve the exact non-secret stderr, including CR/newlines;
                  # stdout is only a fallback when gh supplies no stderr.
                  details = result.stderr or result.stdout or b'GitHub CLI returned no error details.'
                  fail(operation, f'GitHub CLI exited {result.returncode}.\n' + redact(details))
              return redact(result.stdout).strip()

          branch = os.environ.get('SOURCE_BRANCH', '')
          tested_sha = os.environ.get('TESTED_SHA', '')
          if not re.fullmatch(r'development/[A-Za-z0-9][A-Za-z0-9._/-]{0,150}', branch):
              fail('Validate development branch', 'Invalid development branch identity.')
          if not re.fullmatch(r'[a-f0-9]{40}', tested_sha):
              fail('Validate tested commit', 'Invalid tested commit identity.')
          repository_name = os.environ['GITHUB_REPOSITORY']
          current_sha = gh('Read development branch', 'api',
                           f'repos/{repository_name}/git/ref/heads/{branch}', '--jq', '.object.sha')
          if not re.fullmatch(r'[a-f0-9]{40}', current_sha):
              fail('Read development branch', 'GitHub returned an invalid branch commit identity.')
          if current_sha != tested_sha:
              print('The development branch advanced; its newer validation run will handle review creation.')
              raise SystemExit(0)
          existing = gh('List existing pull requests', 'pr', 'list', '--repo', repository_name,
                        '--head', branch, '--state', 'all', '--json', 'url',
                        '--jq', '.[0].url // empty')
          if existing:
              print('A PR already exists for this branch: ' + existing)
              raise SystemExit(0)

          base = 'main'
          if branch.startswith('development/v0.9-'):
              dependency = 'development/v0.8-speech-studio'
              ahead = gh('Verify V0.8 dependency', 'api',
                         f'repos/{repository_name}/compare/main...{quote(dependency, safe="")}', '--jq', '.ahead_by')
              if not ahead.isdigit():
                  fail('Verify V0.8 dependency', 'GitHub returned no valid ancestry comparison.')
              if int(ahead):
                  base = dependency

          repository = os.environ['GITHUB_SERVER_URL'] + '/' + repository_name
          branch_url = repository + '/tree/' + quote(branch, safe='/')
          report_url = repository + '/blob/' + quote(branch, safe='/') + '/docs/TEST_REPORT.md'
          run_url = repository + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          summary = ('Adds seven local Media Privacy tools: encoded text/logo/audio watermarking, audio and video fingerprint comparison, tracking audit, privacy export, C2PA inspection, and before/after verification. They share the queue and linear Black Scripting while preserving original media. ' if branch == 'development/v0.5-media-privacy' else 'Development changes are ready for review. ')
          title = ('FORGE V0.5: Media Privacy and Watermark Studio' if branch == 'development/v0.5-media-privacy' else 'Review ' + branch)
          body = (summary + f'Source: [`{branch}`]({branch_url}). '
                  'This PR remains a draft; review and explicit approval are required before merging.\n\n'
                  f'The full Python suite passed for triggering commit `{tested_sha}` '
                  f'in [this validation run]({run_url}). Check the latest PR checks when the branch changes.\n\n'
                  f'See the branch [validation report]({report_url}) for scope, evidence, and remaining '
                  'browser, native Windows, and physical GPU acceptance. This automation does not merge '
                  'the PR or certify those separate acceptance checks.\n')
          body_file = Path(os.environ['RUNNER_TEMP'], 'forge-review-body.md')
          try:
              body_file.write_text(body, encoding='utf-8')
          except OSError as error:
              fail('Write draft description', str(error))
          created = gh('Create draft pull request', 'pr', 'create', '--repo', repository_name,
                       '--draft', '--base', base, '--head', branch,
                       '--title', title, '--body-file', str(body_file))
          print('Created draft PR: ' + created)
          PYCODE
