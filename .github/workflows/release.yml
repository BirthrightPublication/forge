name: Tested release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - .github/release-target

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Select the exact release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: target
        name: Validate the explicit release target
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
          elif ref == 'refs/heads/main':
              tag = Path('.github/release-target').read_text(encoding='utf-8').strip()
          else:
              raise SystemExit('Only a version tag or the main release-target file can request publication.')
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('The release target must be exactly vMAJOR.MINOR.PATCH.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\n')
          print('Selected exact tag:', tag)
          PY

  build:
    name: Test and package the tagged source
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
            scripts/requirements-media-privacy.txt
      - name: Verify tag and source versions before installing dependencies
        run: |
          python - <<'PY'
          import ast, os
          from pathlib import Path
          version = Path('VERSION.txt').read_text(encoding='utf-8').strip()
          tree = ast.parse(Path('forge/__init__.py').read_text(encoding='utf-8'))
          declared = [ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)]
          if declared != [version] or os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('The tag, VERSION.txt and forge.__version__ must match exactly.')
          Path('Build/validation').mkdir(parents=True)
          print('Verified release version:', version)
          PY
      - name: Install the local media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          if [[ -f scripts/requirements-media-privacy.txt ]]; then
            python -m pip install --disable-pip-version-check -r scripts/requirements-media-privacy.txt
          fi
          python -m pip check
          python -m playwright install --with-deps chromium
          command -v ffmpeg
          command -v ffprobe
      - name: Run the complete Python suite
        run: python -m pytest -q --junitxml=Build/validation/PYTEST.xml | tee Build/validation/PYTHON_TEST_RESULTS.txt
      - name: Run real browser checks in disposable services
        run: |
          python - <<'PY' | tee Build/validation/BROWSER_TEST_RESULTS.txt
          import json, os, shutil, socket, subprocess, sys, tempfile, time, urllib.error, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          evidence = Path('Build/evidence').resolve()
          evidence.mkdir(parents=True)
          with sync_playwright() as playwright:
              chromium = playwright.chromium.executable_path

          def check(script, *arguments):
              subprocess.run([sys.executable, str(Path('tests') / script), '--chromium', chromium,
                              *map(str, arguments)], check=True)

          try:
              if Path('tests/browser_v4_check.py').is_file():
                  with tempfile.TemporaryDirectory(prefix='forge-release-browser-') as temporary:
                      data = Path(temporary) / 'data'
                      with socket.socket() as listener:
                          listener.bind(('127.0.0.1', 0))
                          port = listener.getsockname()[1]
                      with (Path(temporary) / 'service.log').open('w', encoding='utf-8') as log:
                          service = subprocess.Popen([sys.executable, 'server.py'],
                              env={**os.environ, 'FORGE_DATA_DIR': str(data), 'FORGE_PORT': str(port)},
                              stdout=log, stderr=subprocess.STDOUT)
                          try:
                              runtime_path = data / 'runtime.json'
                              for _ in range(150):
                                  if service.poll() is not None:
                                      raise RuntimeError('The disposable browser service stopped during startup.')
                                  if runtime_path.is_file():
                                      runtime = json.loads(runtime_path.read_text())
                                      request = urllib.request.Request(f'http://127.0.0.1:{port}/api/state',
                                          headers={'X-Forge-Token': runtime['token']})
                                      try:
                                          with urllib.request.urlopen(request, timeout=1) as response:
                                              response.read()
                                          break
                                      except (OSError, urllib.error.URLError):
                                          pass
                                  time.sleep(.1)
                              else:
                                  raise RuntimeError('The disposable browser service did not become ready.')
                              check('browser_v4_check.py', '--runtime', runtime_path,
                                    '--output', evidence / 'studio', '--allow-test-writes')
                          finally:
                              service.terminate()
                              try:
                                  service.wait(timeout=10)
                              except subprocess.TimeoutExpired:
                                  service.kill()
                                  service.wait(timeout=10)
              check('browser_black_scripting_check.py', '--output', evidence / 'black-scripting', '--allow-test-writes')
              check('browser_generators_check.py', '--output', evidence / 'generators')
              if Path('tests/browser_v5_check.py').is_file():
                  check('browser_v5_check.py', '--output', evidence / 'media-privacy', '--allow-test-writes')
          finally:
              # Retain only explicit test reports and screenshots, never service
              # databases, runtime credentials, model caches or generated values.
              for path in evidence.rglob('*'):
                  if path.is_file() and ((path.suffix == '.png' and path.name.startswith(('FORGE-', 'black-scripting-'))) or path.name in {
                          'BROWSER_V0.4_RESULTS.json', 'BROWSER_GENERATORS_RESULTS.json',
                          'BROWSER_V0.5_RESULTS.json', 'browser-results.json', 'BROWSER_V05_RESULTS.json',
                          'BROWSER_V05_REPORT.json'}):
                      target = Path('Build/validation/browser') / path.relative_to(evidence)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, target)
          PY
      - name: Build and verify the installer-compatible release
        run: |
          python scripts/package_release.py --output Build/release
          python - <<'PY'
          import hashlib, json, os, platform, shutil, subprocess
          from pathlib import Path
          release = Path('Build/release')
          for name in ('Update FORGE.bat', 'CHANGELOG.md'):
              shutil.copyfile(name, release / name)
          for name in ('PYTHON_TEST_RESULTS.txt', 'PYTEST.xml', 'BROWSER_TEST_RESULTS.txt'):
              shutil.copyfile(Path('Build/validation') / name, release / name)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          validation = {'tag': os.environ['RELEASE_TAG'], 'source_commit': commit,
                        'python': platform.python_version(), 'platform': platform.platform(),
                        'python_suite': 'passed', 'browser_checks': 'passed',
                        'manifest_validation': 'passed', 'native_windows_tested': False,
                        'physical_gpu_tested': False,
                        'actions_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                                       + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}
          (release / 'VALIDATION.json').write_text(json.dumps(validation, indent=2) + '\n', encoding='utf-8')
          shutil.make_archive(str(release / 'BROWSER_EVIDENCE'), 'zip', 'Build/validation/browser')
          checksums = ''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
                              for path in sorted(release.iterdir()) if path.is_file())
          (release / 'CHECKSUMS.sha256').write_text(checksums, encoding='utf-8')
          short = os.environ['RELEASE_TAG'][:-2] if os.environ['RELEASE_TAG'].endswith('.0') else os.environ['RELEASE_TAG']
          notes = (f'FORGE {short}, built from exact tag `{os.environ["RELEASE_TAG"]}` at `{commit}`.\n\n'
                   f'Download `FORGE-{short}.zip` from the assets below. Leave it intact in `B:\\Forge\\Build` '
                   'and run `B:\\Forge\\Update FORGE.bat`; the matching standalone updater is attached. '
                   'GitHub’s automatic Source code archives are not updater packages.\n\n'
                   'The full Python suite, real Linux Chromium checks and release-manifest validation passed before publication. '
                   'Results, screenshots, changelog and SHA-256 checksums are attached. Native Windows and physical GPU '
                   'acceptance are separate checks; Linux CI does not certify them.\n\n'
                   f'Validation run: {validation["actions_run"]}\n')
          Path('Build/RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PY
      - name: Retain validation evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ needs.resolve.outputs.tag }}
          path: Build/validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Transfer verified release assets to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: |
            Build/release/
            Build/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish only the tested assets
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: forge-release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: tested
      - name: Verify transferred files
        working-directory: tested/release
        run: sha256sum --check CHECKSUMS.sha256
      - name: Create the release and publish after all assets upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Existing tags and release assets are never replaced by this workflow.' >&2
            exit 1
          fi
          assets=(tested/release/*)
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "FORGE $RELEASE_TAG" --notes-file tested/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
