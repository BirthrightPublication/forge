name: Tested release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved tag to validate and publish
        required: true
        default: v0.6.0
        type: string
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - .github/release-target

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Select the exact release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      speech_required: ${{ steps.target.outputs.speech_required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: target
        name: Validate the explicit release target
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          ref = os.environ['GITHUB_REF']
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              if ref != 'refs/heads/main':
                  raise SystemExit('Manual publication must use the reviewed main workflow.')
              tag = os.environ['REQUESTED_TAG']
          elif ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
          elif ref == 'refs/heads/main':
              tag = Path('.github/release-target').read_text(encoding='utf-8').strip()
          else:
              raise SystemExit('Only a version tag or the main release-target file can request publication.')
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('The release target must be exactly vMAJOR.MINOR.PATCH.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\n')
              speech_required = tuple(map(int, tag[1:].split('.'))) >= (0, 8, 0)
              output.write(f'speech_required={str(speech_required).lower()}\n')
          print('Selected exact tag:', tag)
          PY

  build:
    name: Test and package the tagged source
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
            scripts/requirements-media-privacy.txt
      - name: Verify tag and source versions before installing dependencies
        run: |
          python - <<'PY'
          import ast, os
          from pathlib import Path
          version = Path('VERSION.txt').read_text(encoding='utf-8').strip()
          tree = ast.parse(Path('forge/__init__.py').read_text(encoding='utf-8'))
          declared = [ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)]
          if declared != [version] or os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('The tag, VERSION.txt and forge.__version__ must match exactly.')
          Path('Build/validation').mkdir(parents=True)
          print('Verified release version:', version)
          PY
      - name: Ensure local media tools are available
        timeout-minutes: 10
        run: |
          media_log="$RUNNER_TEMP/forge-media-setup.log"
          trap 'code=$?; tail -n 15 "$media_log" 2>/dev/null | while IFS= read -r line; do line="${line//%/%25}"; echo "::error title=Media setup::$line"; done; exit "$code"' ERR
          missing=()
          command -v ffmpeg || missing+=(ffmpeg)
          command -v ffprobe || missing+=(ffprobe)
          [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]] || missing+=(DejaVuSans.ttf)
          echo "::notice title=Media prerequisites::Missing: ${missing[*]:-none}"
          if (( ${#missing[@]} )); then
            # Hosted images carry package indexes. Try those before refreshing
            # unrelated repositories; never bypass the required media tools.
            if ! sudo timeout 120 apt-get install --no-install-recommends -y -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 ffmpeg fonts-dejavu-core 2>&1 | tee "$media_log"; then
              echo '::notice title=Media retry::Using official Ubuntu HTTPS archives with the installed Ubuntu signing keyring.'
              ubuntu_sources="$RUNNER_TEMP/forge-ubuntu.sources"
              printf '%s\n' 'Types: deb' 'URIs: https://archive.ubuntu.com/ubuntu/' 'Suites: noble noble-updates noble-backports' 'Components: main restricted universe multiverse' 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' '' 'Types: deb' 'URIs: https://security.ubuntu.com/ubuntu/' 'Suites: noble-security' 'Components: main restricted universe multiverse' 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' > "$ubuntu_sources"
              apt_sources=(-o "Dir::Etc::sourcelist=$ubuntu_sources" -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true)
              sudo timeout 180 apt-get update "${apt_sources[@]}" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 2>&1 | tee -a "$media_log"
              sudo timeout 180 apt-get install "${apt_sources[@]}" --no-install-recommends -y -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 ffmpeg fonts-dejavu-core 2>&1 | tee -a "$media_log"
            fi
          fi
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Install the tagged Python test dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 --only-binary=:all: -r requirements-dev.txt
          if [[ -f scripts/requirements-media-privacy.txt ]]; then
            python -m pip install --disable-pip-version-check --timeout 30 --retries 1 --only-binary=:all: -r scripts/requirements-media-privacy.txt
          fi
          python -m pip check
      - name: Install and verify Chromium
        timeout-minutes: 8
        run: |
          python -m playwright install chromium
          check_browser() {
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()'
          }
          if ! check_browser; then
            timeout 180 python -m playwright install-deps chromium
            check_browser
          fi
      - name: Run the complete Python suite
        run: python -m pytest -q --junitxml=Build/validation/PYTEST.xml | tee Build/validation/PYTHON_TEST_RESULTS.txt
      - name: Run real browser checks in disposable services
        run: |
          python - <<'PY' | tee Build/validation/BROWSER_TEST_RESULTS.txt
          import json, os, shutil, socket, subprocess, sys, tempfile, time, urllib.error, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          evidence = Path('Build/evidence').resolve()
          evidence.mkdir(parents=True)
          with sync_playwright() as playwright:
              chromium = playwright.chromium.executable_path

          def check(script, *arguments):
              subprocess.run([sys.executable, str(Path('tests') / script), '--chromium', chromium,
                              *map(str, arguments)], check=True)

          try:
              if Path('tests/browser_v4_check.py').is_file():
                  with tempfile.TemporaryDirectory(prefix='forge-release-browser-') as temporary:
                      data = Path(temporary) / 'data'
                      with socket.socket() as listener:
                          listener.bind(('127.0.0.1', 0))
                          port = listener.getsockname()[1]
                      with (Path(temporary) / 'service.log').open('w', encoding='utf-8') as log:
                          service = subprocess.Popen([sys.executable, 'server.py'],
                              env={**os.environ, 'FORGE_DATA_DIR': str(data), 'FORGE_PORT': str(port)},
                              stdout=log, stderr=subprocess.STDOUT)
                          try:
                              runtime_path = data / 'runtime.json'
                              for _ in range(150):
                                  if service.poll() is not None:
                                      raise RuntimeError('The disposable browser service stopped during startup.')
                                  if runtime_path.is_file():
                                      runtime = json.loads(runtime_path.read_text())
                                      request = urllib.request.Request(f'http://127.0.0.1:{port}/api/state',
                                          headers={'X-Forge-Token': runtime['token']})
                                      try:
                                          with urllib.request.urlopen(request, timeout=1) as response:
                                              response.read()
                                          break
                                      except (OSError, urllib.error.URLError):
                                          pass
                                  time.sleep(.1)
                              else:
                                  raise RuntimeError('The disposable browser service did not become ready.')
                              check('browser_v4_check.py', '--runtime', runtime_path,
                                    '--output', evidence / 'studio', '--allow-test-writes')
                          finally:
                              service.terminate()
                              try:
                                  service.wait(timeout=10)
                              except subprocess.TimeoutExpired:
                                  service.kill()
                                  service.wait(timeout=10)
              check('browser_black_scripting_check.py', '--output', evidence / 'black-scripting', '--allow-test-writes')
              check('browser_generators_check.py', '--output', evidence / 'generators')
              if Path('tests/browser_v5_check.py').is_file():
                  check('browser_v5_check.py', '--output', evidence / 'media-privacy', '--allow-test-writes')
              if Path('tests/browser_v6_check.py').is_file():
                  check('browser_v6_check.py', '--output', evidence / 'birthright-updates')
              if Path('tests/browser_v8_check.py').is_file():
                  check('browser_v8_check.py', '--output', evidence / 'speech-studio')
              if Path('tests/browser_v7_check.py').is_file():
                  check('browser_v7_check.py', '--output', evidence / 'download-studio')
          finally:
              # Retain only explicit test reports and screenshots, never service
              # databases, runtime credentials, model caches or generated values.
              for path in evidence.rglob('*'):
                  if path.is_file() and ((path.suffix == '.png' and path.name.startswith(('FORGE-', 'black-scripting-'))) or path.name in {
                          'BROWSER_V0.4_RESULTS.json', 'BROWSER_GENERATORS_RESULTS.json',
                          'BROWSER_V0.5_RESULTS.json', 'BROWSER_V0.5_STUDIO_RESULTS.json', 'browser-results.json', 'BROWSER_V05_RESULTS.json',
                          'BROWSER_V05_REPORT.json', 'BROWSER_V6_RESULTS.json'}):
                      target = Path('Build/validation/browser') / path.relative_to(evidence)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, target)
          PY
      - name: Build and verify the installer-compatible release
        run: |
          python scripts/package_release.py --output Build/release
          python - <<'PY'
          import hashlib, json, os, platform, shutil, subprocess
          from pathlib import Path
          release = Path('Build/release')
          for name in ('Update FORGE.bat', 'CHANGELOG.md'):
              # GitHub normalizes asset spaces to dots; checksum the public name.
              shutil.copyfile(name, release / name.replace(' ', '.'))
          for name in ('PYTHON_TEST_RESULTS.txt', 'PYTEST.xml', 'BROWSER_TEST_RESULTS.txt'):
              shutil.copyfile(Path('Build/validation') / name, release / name)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          validation = {'tag': os.environ['RELEASE_TAG'], 'source_commit': commit,
                        'python': platform.python_version(), 'platform': platform.platform(),
                        'python_suite': 'passed', 'browser_checks': 'passed',
                        'manifest_validation': 'passed', 'native_windows_tested': False,
                        'physical_gpu_tested': False,
                        'actions_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                                       + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}
          (release / 'VALIDATION.json').write_text(json.dumps(validation, indent=2) + '\n', encoding='utf-8')
          shutil.make_archive(str(release / 'BROWSER_EVIDENCE'), 'zip', 'Build/validation/browser')
          checksums = ''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
                              for path in sorted(release.iterdir()) if path.is_file())
          (release / 'CHECKSUMS.sha256').write_text(checksums, encoding='utf-8')
          short = os.environ['RELEASE_TAG'][:-2] if os.environ['RELEASE_TAG'].endswith('.0') else os.environ['RELEASE_TAG']
          notes = (f'FORGE {short}, built from exact tag `{os.environ["RELEASE_TAG"]}` at `{commit}`.\n\n'
                   f'Windows GitHub updater: use `FORGE-{os.environ["RELEASE_TAG"]}-windows-x64.zip` '
                   'and its matching `.zip.sha256` asset. Keep your installed `Update-Application.ps1` and '
                   '`Update FORGE.bat`; finish queued work and close FORGE before running the updater. '
                   'The complete application payload is under `app/`; installed updater files and user data are excluded.\n\n'
                   'To avoid the supplied updater\'s shortened TEMP-path bug, start its existing wrapper from PowerShell:\n\n'
                   "```powershell\n$env:TEMP = 'B:\\Forge\\Build'\n& 'B:\\Forge\\Update FORGE.bat'\n```\n\n"
                   f'Legacy offline updater: download `FORGE-{short}.zip` from the assets below. Leave it intact in `B:\\Forge\\Build` '
                   'and run `B:\\Forge\\Update FORGE.bat`. If downloading the standalone `Update.FORGE.bat` asset, '
                   'save it as `B:\\Forge\\Update FORGE.bat`. '
                   'GitHub’s automatic Source code archives are not updater packages.\n\n'
                   'The full Python suite, real Linux Chromium checks and release-manifest validation passed before publication. '
                   'Results, screenshots, changelog and SHA-256 checksums are attached. The separate Windows validation receipt '
                   'records native updater and installed-app checks with canonical temporary paths. Physical GPU acceptance remains separate.\n\n'
                   f'Validation run: {validation["actions_run"]}\n')
          if os.environ['RELEASE_TAG'] == 'v0.8.0':
              notes = (f'FORGE {os.environ["RELEASE_TAG"]}, built from `{commit}`.\n\n'
                       + Path('docs/V0.8-RELEASE.md').read_text(encoding='utf-8')
                       + f'\nValidation run: {validation["actions_run"]}\n')
          Path('Build/RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PY
      - name: Retain validation evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-${{ needs.resolve.outputs.tag }}
          path: Build/validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Transfer verified release assets to the publisher
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: |
            Build/release/
            Build/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Validate the Windows installation package
    needs: resolve
    # Permission ceiling for the reusable workflow's optional publisher; build_only
    # disables that job, and its build/acceptance jobs explicitly use contents: read.
    permissions:
      contents: write
    uses: ./.github/workflows/windows-release.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      build_only: true

  speech:
    name: Require actual native speech model CPU acceptance
    needs: resolve
    if: needs.resolve.outputs.speech_required == 'true'
    uses: ./.github/workflows/speech-acceptance.yml
    with:
      source_ref: refs/tags/${{ needs.resolve.outputs.tag }}

  publish:
    name: Publish only the tested assets
    needs: [resolve, build, windows, speech]
    # Historical pre-speech tags may skip the new model gate. New releases must
    # fail closed on failed/cancelled/skipped actual model acceptance.
    if: >-
      always() && needs.resolve.result == 'success' &&
      needs.build.result == 'success' && needs.windows.result == 'success' &&
      (needs.resolve.outputs.speech_required == 'false' ||
       (needs.resolve.outputs.speech_required == 'true' && needs.speech.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: forge-release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SPEECH_REQUIRED: ${{ needs.resolve.outputs.speech_required }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: tested
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: tested-windows-${{ needs.resolve.outputs.tag }}
          path: tested/release
      - name: Download only passed same-run CPU speech acceptance
        if: needs.resolve.outputs.speech_required == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.speech.outputs.evidence_artifact }}
          path: tested/release
      - name: Verify transferred files
        working-directory: tested/release
        run: |
          sha256sum --check CHECKSUMS.sha256
          sha256sum --check "FORGE-${RELEASE_TAG}-windows-x64.zip.sha256"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          legacy = json.loads(Path('VALIDATION.json').read_text())
          windows = json.loads(Path(f'FORGE-{tag}-windows-x64.validation.json').read_text())
          if (legacy['tag'] != tag or windows['tag'] != tag
                  or not re.fullmatch(r'[a-f0-9]{40}', legacy['source_commit'])
                  or legacy['source_commit'] != windows['source_commit']
                  or windows.get('native_windows_updater') != 'passed'
                  or windows.get('native_windows_execution') is not True):
              raise SystemExit('Legacy and Windows assets must identify the same tested source commit and tag.')
          archive = Path(f'FORGE-{tag}-windows-x64.zip')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != windows['archive_sha256']:
              raise SystemExit('Windows acceptance evidence does not describe the transferred ZIP.')
          if os.environ['SPEECH_REQUIRED'] == 'true':
              speech = json.loads(Path('SPEECH_ACCEPTANCE.json').read_text())
              evidence = Path('SPEECH_EVIDENCE.zip')
              if (speech.get('status') != 'passed' or speech.get('source_commit') != legacy['source_commit']
                      or speech.get('actions_run_id') != os.environ['GITHUB_RUN_ID']
                      or speech.get('scope') != 'native-windows-cpu-synthetic-speech'
                      or speech.get('native_windows_execution') is not True or speech.get('device') != 'cpu'
                      or speech.get('physical_gpu_tested') is not False
                      or speech.get('full_hardware_acceptance') is not False
                      or speech.get('inference_substituted') is not False
                      or speech.get('evidence_archive') != {'name': evidence.name,
                          'sha256': hashlib.sha256(evidence.read_bytes()).hexdigest()}):
                  raise SystemExit('Passed actual CPU speech evidence must identify the exact packaged source and this run.')
              notes = Path('../RELEASE_NOTES.md')
              with notes.open('a', encoding='utf-8') as output:
                  output.write('\nActual native Windows CPU Kokoro, Ming, four Bark models, Whisper comparisons '
                               'and queued speech pipeline evidence is attached. Controlled synthetic fixtures '
                               'do not establish general comparative accuracy. CUDA, owner hardware and listening '
                               'acceptance remain unverified. The owner explicitly excepted physical GPU acceptance '
                               'for V0.8.0 only; no other failed test is waived. CUDA is experimental.\n')
          elif os.environ['SPEECH_REQUIRED'] != 'false':
              raise SystemExit('The speech release gate must explicitly resolve true or false.')
          assets = sorted(path for path in Path('.').iterdir()
                          if path.is_file() and path.name != 'CHECKSUMS.sha256')
          Path('CHECKSUMS.sha256').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in assets), encoding='utf-8')
          PY
      - name: Create the release and publish after all assets upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > tested/verify-release-source.py <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repository, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          expected = json.loads(Path('tested/release/VALIDATION.json').read_text())['source_commit']
          def request(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/{path}'], text=True))
          value = request(f'git/ref/tags/{tag}')['object']
          for _ in range(8):
              if value.get('type') == 'commit':
                  if value['sha'] != expected:
                      raise SystemExit('Release tag moved away from the tested source; publication stopped.')
                  break
              if value.get('type') != 'tag':
                  raise SystemExit('Release tag does not resolve to a commit.')
              value = request('git/tags/' + value['sha'])['object']
          else:
              raise SystemExit('Too many annotated-tag indirections.')
          print('Remote tag matches both tested application packages:', expected)
          PY
          python3 tested/verify-release-source.py
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Existing tags and release assets are never replaced by this workflow.' >&2
            exit 1
          fi
          assets=(tested/release/*)
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "FORGE $RELEASE_TAG" --notes-file tested/RELEASE_NOTES.md
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          repository, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          archive = f'FORGE-{tag}-windows-x64.zip'
          required = (archive, archive + '.sha256', f'FORGE-{tag}-windows-x64.validation.json')
          if os.environ['SPEECH_REQUIRED'] == 'true':
              required += ('SPEECH_ACCEPTANCE.json', 'SPEECH_EVIDENCE.zip', 'CHECKSUMS.sha256')
          def request(path, destination=None):
              command = ['gh', 'api', '--method', 'GET', f'repos/{repository}/{path}']
              if destination is not None:
                  command += ['--header', 'Accept: application/octet-stream']
              result = subprocess.run(command, stdout=destination or subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode:
                  raise SystemExit('Authenticated draft-release verification request failed; publication stopped.')
              if destination is None:
                  return json.loads(result.stdout)
          def collection(path):
              items = []
              for page in range(1, 101):
                  batch = request(f'{path}?per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise SystemExit('Invalid draft-release API inventory.')
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
              raise SystemExit('Draft-release API inventory exceeded the verification limit.')
          # The REST tag endpoint only finds published releases; authenticated
          # release listings also include the draft that was just created.
          releases = [release for release in collection('releases') if release.get('tag_name') == tag]
          if len(releases) != 1:
              raise SystemExit('Expected exactly one draft release for the tested tag.')
          release_id = releases[0]['id']
          def inventory():
              current = request(f'releases/{release_id}')
              if current.get('draft') is not True or current.get('tag_name') != tag:
                  raise SystemExit('Release must remain a draft for the expected tag during asset verification.')
              assets = collection(f'releases/{release_id}/assets')
              names = [asset['name'] for asset in assets]
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate release asset names; publication stopped.')
              windows = [name for name in names if re.search(r'(win(dows)?|x64|amd64)', name, re.I)
                         and name.lower().endswith('.zip')]
              if windows != [archive] or not set(required).issubset(names):
                  raise SystemExit('Release must contain exactly the expected Windows ZIP and its checksum and validation receipt.')
              return {asset['name']: asset for asset in assets}
          assets = inventory()
          verified = {}
          with tempfile.TemporaryDirectory(prefix='forge-release-download-', dir=os.environ['RUNNER_TEMP']) as temporary:
              for name in required:
                  local = Path('tested/release') / name
                  asset = assets[name]
                  if asset['size'] != local.stat().st_size:
                      raise SystemExit('Uploaded Windows asset size differs from the tested file; publication stopped.')
                  downloaded = Path(temporary) / name
                  with downloaded.open('wb') as output:
                      request(f"releases/assets/{asset['id']}", output)
                  if (downloaded.stat().st_size != local.stat().st_size
                          or hashlib.sha256(downloaded.read_bytes()).digest() != hashlib.sha256(local.read_bytes()).digest()):
                      raise SystemExit('Downloaded Windows asset differs from the tested file; publication stopped.')
                  verified[name] = (asset['id'], asset['size'], asset.get('updated_at'))
          final = inventory()
          if any((final[name]['id'], final[name]['size'], final[name].get('updated_at')) != identity
                 for name, identity in verified.items()):
              raise SystemExit('Windows release assets changed during verification; publication stopped.')
          print('Authenticated draft downloads match all required tested assets; exactly one Windows ZIP is present.')
          PY
          python3 tested/verify-release-source.py
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
